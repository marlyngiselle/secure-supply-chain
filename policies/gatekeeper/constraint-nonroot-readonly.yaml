apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sNonRootReadOnly
metadata:
  name: workloads-nonroot-readonly
spec:
  enforcementAction: deny
  match:
    kinds:
      - apiGroups: [""]
        kinds: [Pod]
    excludedNamespaces:
      - kube-system
      - gatekeeper-system
  parameters:
    exemptImages: []
