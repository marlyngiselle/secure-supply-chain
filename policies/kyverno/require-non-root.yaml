# Containers run as a non-root UID, cannot escalate, drop every capability
# and use the runtime's default seccomp profile. Mirrors the Pod Security
# "restricted" profile so the policy holds even in namespaces without PSA labels.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-non-root
  annotations:
    policies.kyverno.io/title: Require non-root and least privilege
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Pods must set runAsNonRoot, forbid privilege escalation, drop ALL
      capabilities and use the RuntimeDefault seccomp profile.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: run-as-non-root
      match:
        any:
          - resources:
              kinds: [Pod]
      validate:
        message: "runAsNonRoot must be true at pod or container level, and runAsUser must not be 0."
        anyPattern:
          - spec:
              securityContext:
                runAsNonRoot: true
                =(runAsUser): ">0"
              containers:
                - =(securityContext):
                    =(runAsNonRoot): true
                    =(runAsUser): ">0"
          - spec:
              containers:
                - securityContext:
                    runAsNonRoot: true
                    =(runAsUser): ">0"
    - name: least-privilege
      match:
        any:
          - resources:
              kinds: [Pod]
      validate:
        message: "Containers must set allowPrivilegeEscalation=false and drop ALL capabilities."
        pattern:
          spec:
            containers:
              - securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop: ["ALL"]
    - name: seccomp-runtime-default
      match:
        any:
          - resources:
              kinds: [Pod]
      validate:
        message: "The pod must use the RuntimeDefault or Localhost seccomp profile."
        pattern:
          spec:
            securityContext:
              seccompProfile:
                type: "RuntimeDefault | Localhost"
