# A mutable tag defeats every other control: what was signed is not
# necessarily what gets pulled. Require an explicit, non-latest tag or a digest.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow latest tag
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Every container image must name a tag other than latest, or a digest.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-explicit-tag
      match:
        any:
          - resources:
              kinds: [Pod]
      validate:
        message: "Images must carry an explicit tag or digest."
        foreach:
          - list: "request.object.spec.[containers, initContainers, ephemeralContainers][]"
            deny:
              conditions:
                all:
                  - key: "{{ element.image }}"
                    operator: NotEquals
                    value: "*:*"
                  - key: "{{ element.image }}"
                    operator: NotEquals
                    value: "*@sha256:*"
    - name: forbid-latest
      match:
        any:
          - resources:
              kinds: [Pod]
      validate:
        message: "The :latest tag is not allowed. Pin a version or a digest."
        foreach:
          - list: "request.object.spec.[containers, initContainers, ephemeralContainers][]"
            deny:
              conditions:
                any:
                  - key: "{{ element.image }}"
                    operator: Equals
                    value: "*:latest"
