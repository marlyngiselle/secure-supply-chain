<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">secure-supply-chain</title>
  <desc id="d">A chain of links leading to a verified seal, on a navy to blue gradient.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1f4d"/>
      <stop offset="1" stop-color="#2456c8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#9bbcff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#9bbcff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>

  <!-- Chain: interlocking links flowing toward the seal -->
  <g fill="none" stroke-width="7" stroke-linecap="round">
    <rect x="640" y="132" width="78" height="36" rx="18" stroke="#ffffff" stroke-opacity="0.22"/>
    <rect x="696" y="118" width="40" height="64" rx="20" stroke="#ffffff" stroke-opacity="0.32"/>
    <rect x="716" y="132" width="78" height="36" rx="18" stroke="#ffffff" stroke-opacity="0.45"/>
    <rect x="772" y="118" width="40" height="64" rx="20" stroke="#ffffff" stroke-opacity="0.6"/>
    <rect x="792" y="132" width="78" height="36" rx="18" stroke="#ffffff" stroke-opacity="0.78"/>
    <rect x="848" y="118" width="40" height="64" rx="20" stroke="#c3d5ff"/>
  </g>

  <!-- Seal: scalloped badge with a check mark -->
  <g transform="translate(1000 150)">
    <circle r="92" fill="#ffffff" fill-opacity="0.06"/>
    <path fill="#ffffff" fill-opacity="0.14" stroke="#c3d5ff" stroke-width="3"
      d="M0,-74 L14,-66 L30,-68 L38,-54 L53,-48 L54,-32 L66,-21 L61,-6 L68,8 L58,20 L58,36 L44,43 L38,58 L22,59 L10,70 L-5,64 L-19,71 L-30,61 L-46,60 L-50,45 L-64,37 L-62,21 L-71,8 L-63,-6 L-67,-21 L-55,-32 L-54,-48 L-39,-54 L-31,-68 L-15,-66 Z"/>
    <circle r="46" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="4"/>
    <path d="M-20,2 L-5,17 L23,-14" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Thin signature line under the chain -->
  <path d="M640 214 C 720 200, 800 228, 900 210" fill="none" stroke="#9bbcff" stroke-opacity="0.55" stroke-width="2"/>

  <!-- Text -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#ffffff">
    <text x="72" y="128" font-size="52" font-weight="700" letter-spacing="-1">secure-supply-chain</text>
    <text x="74" y="172" font-size="22" fill-opacity="0.82">Built, scanned, signed, attested and verified at admission.</text>
    <text x="74" y="230" font-size="14" font-weight="600" letter-spacing="2" fill-opacity="0.72" xml:space="preserve">SBOM   <tspan fill="#9bbcff">&#183;</tspan>   COSIGN   <tspan fill="#9bbcff">&#183;</tspan>   SLSA L3   <tspan fill="#9bbcff">&#183;</tspan>   KYVERNO</text>
  </g>
</svg>
