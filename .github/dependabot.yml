version: 2

updates:
  # Pinned action SHAs. Dependabot bumps the SHA and the version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  # Base images pinned by digest in app/Dockerfile.
  - package-ecosystem: docker
    directory: /app
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build

  # Go modules. The service has no third-party dependencies today;
  # this entry keeps the toolchain directive current and catches the first one.
  - package-ecosystem: gomod
    directory: /app
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: deps
